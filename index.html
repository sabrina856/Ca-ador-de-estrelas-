<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Caçador de Estrelas ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #101624, #1a1f2f);
            padding: 20px;
            border-radius: 48px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        canvas {
            display: block;
            width: 800px;
            height: 600px;
            border-radius: 32px;
            cursor: none;
            box-shadow: 0 0 30px rgba(0,180,255,0.2), inset 0 0 30px rgba(0,0,0,0.7);
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 0 10px;
            color: #c0d0e0;
            letter-spacing: 1px;
            font-weight: 400;
            text-shadow: 0 2px 5px #00000080;
        }
        .score {
            background: #1e2638;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff8c0;
            box-shadow: inset 0 2px 5px #00000055, 0 5px 10px #00000033;
            border: 1px solid #3a4a66;
            backdrop-filter: blur(2px);
        }
        .score span {
            color: #ffd966;
            font-size: 2rem;
            margin-left: 8px;
        }
        .hint {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #1a212ecc;
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid #3e506e;
            font-size: 1.05rem;
        }
        .hint i {
            font-style: normal;
            display: inline-block;
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        button {
            background: #2f3e5a;
            border: none;
            color: white;
            font-size: 1.1rem;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 0 #0f121b, 0 8px 15px #00000060;
            transition: all 0.08s ease;
            letter-spacing: 0.8px;
            border: 1px solid #6d85aa;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f121b, 0 5px 12px #00000060;
        }
        button:hover {
            background: #3e5272;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info-panel">
        <div class="score">⭐ <span id="scoreDisplay">0</span></div>
        <div class="hint">
            <i>✨</i> Mova a nave <i>✨</i>
        </div>
        <button id="restartBtn">⟳ REINICIAR</button>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        // ---------- CONFIGURAÇÕES CRIATIVAS ----------
        const SHIP_RADIUS = 22;           // tamanho da nave
        const STAR_RADIUS = 10;           // raio das estrelas coletáveis
        const ASTEROID_MIN_RADIUS = 12;   // asteroide pequeno
        const ASTEROID_MAX_RADIUS = 28;   // asteroide grande
        const MAX_STARS = 6;              // estrelas simultâneas
        const MAX_ASTEROIDS = 5;          // asteroides simultâneos
        const STAR_SPEED = 1.8;           // velocidade de queda das estrelas
        const ASTEROID_SPEED = 2.6;       // asteroides são mais rápidos

        // ---------- ESTADO DO JOGO ----------
        let gameActive = true;
        let score = 0;

        // posição da nave (mouse)
        let mouseX = 400, mouseY = 300;   // centro inicial
        let shipX = mouseX, shipY = mouseY;

        // arrays de objetos
        let stars = [];
        let asteroids = [];

        // frames para spawn (controle criativo)
        let frameCounter = 0;
        const SPAWN_STAR_RATE = 28;       // a cada 28 frames tenta spawnar estrela
        const SPAWN_ASTEROID_RATE = 45;   // asteroides são mais frequentes

        // rastro da nave (efeito visual)
        let trail = [];

        // ---------- CONTROLE DE MOUSE ----------
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let rawX = (e.clientX - rect.left) * scaleX;
            let rawY = (e.clientY - rect.top) * scaleY;

            // mantém a nave dentro do canvas com margem
            rawX = Math.min(Math.max(rawX, SHIP_RADIUS), canvas.width - SHIP_RADIUS);
            rawY = Math.min(Math.max(rawY, SHIP_RADIUS), canvas.height - SHIP_RADIUS);

            mouseX = rawX;
            mouseY = rawY;
        });

        // Suaviza o movimento da nave (efeito elegante)
        function lerpShip() {
            shipX += (mouseX - shipX) * 0.18;
            shipY += (mouseY - shipY) * 0.18;
        }

        // ---------- GERADORES DE OBJETOS (CRIATIVOS) ----------
        function createStar() {
            const x = Math.random() * (canvas.width - 2 * STAR_RADIUS) + STAR_RADIUS;
            const y = -STAR_RADIUS * 2; // começa acima da tela
            const speed = STAR_SPEED + Math.random() * 1.2;
            // cores de estrela: dourado, ciano, rosa, branco
            const hues = [50, 180, 320, 0, 200];
            const hue = hues[Math.floor(Math.random() * hues.length)];
            return {
                x, y,
                radius: STAR_RADIUS * (0.8 + Math.random() * 0.5),
                speed: speed,
                hue: hue,
                brightness: 70 + Math.random() * 30,
                twinkle: Math.random() * 6.28,
                type: 'star'
            };
        }

        function createAsteroid() {
            const radius = ASTEROID_MIN_RADIUS + Math.random() * (ASTEROID_MAX_RADIUS - ASTEROID_MIN_RADIUS);
            const x = Math.random() * (canvas.width - 2 * radius) + radius;
            const y = -radius * 2;
            const speed = ASTEROID_SPEED + Math.random() * 1.8;
            // formato irregular para cada asteroide
            const points = 5 + Math.floor(Math.random() * 4);
            const vertices = [];
            for (let i = 0; i < points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const dist = radius * (0.7 + Math.random() * 0.6);
                vertices.push({
                    x: Math.cos(angle) * dist,
                    y: Math.sin(angle) * dist
                });
            }
            return {
                x, y,
                radius: radius,
                speed: speed,
                vertices: vertices,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.03,
                type: 'asteroid',
                hue: 20 + Math.random() * 30, // tons terrosos
            };
        }

        // ---------- SPAWN CONTROLADO ----------
        function spawnObjects() {
            if (!gameActive) return;

            // Estrelas: mantém até MAX_STARS
            if (stars.length < MAX_STARS && frameCounter % SPAWN_STAR_RATE === 0) {
                // Chance extra para não acumular muitas de uma vez
                if (Math.random() < 0.7) {
                    stars.push(createStar());
                }
            }

            // Asteroides: mais perigosos
            if (asteroids.length < MAX_ASTEROIDS && frameCounter % SPAWN_ASTEROID_RATE === 0) {
                if (Math.random() < 0.8) {
                    asteroids.push(createAsteroid());
                }
            }
        }

        // ---------- ATUALIZAÇÃO DOS OBJETOS ----------
        function updateObjects() {
            // Atualiza estrelas
            for (let i = stars.length - 1; i >= 0; i--) {
                const s = stars[i];
                s.y += s.speed;
                s.twinkle += 0.1;

                // Remove se saiu da tela (parte inferior)
                if (s.y - s.radius > canvas.height + 30) {
                    stars.splice(i, 1);
                    continue;
                }

                // Colisão com a nave (coleta)
                const dx = s.x - shipX;
                const dy = s.y - shipY;
                const dist = Math.hypot(dx, dy);
                if (dist < SHIP_RADIUS + s.radius * 0.9) {
                    // Coletou estrela
                    stars.splice(i, 1);
                    score += 10;
                    updateScore();
                    // Efeito: pequena explosão de partículas (visual extra)
                    continue;
                }
            }

            // Atualiza asteroides
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.y += a.speed;
                a.rotation += a.rotSpeed;

                // Remove se saiu da tela
                if (a.y - a.radius > canvas.height + 50) {
                    asteroids.splice(i, 1);
                    continue;
                }

                // Colisão com a nave (game over)
                const dx = a.x - shipX;
                const dy = a.y - shipY;
                const dist = Math.hypot(dx, dy);
                if (dist < SHIP_RADIUS + a.radius * 0.8) {
                    gameActive = false;
                    // Para todos os movimentos, mas mantemos os objetos para desenho
                    return; // sai da função, pois gameActive já é false
                }
            }
        }

        // ---------- PONTUAÇÃO ----------
        function updateScore() {
            scoreSpan.textContent = score;
        }

        // ---------- RESET DO JOGO ----------
        function resetGame() {
            gameActive = true;
            score = 0;
            updateScore();
            stars = [];
            asteroids = [];
            frameCounter = 0;
            trail = [];

            // Reposiciona a nave no centro (ou na posição do mouse)
            mouseX = canvas.width / 2;
            mouseY = canvas.height / 2;
            shipX = mouseX;
            shipY = mouseY;

            // Limpa possíveis animações
        }

        // ---------- DESENHO CRIATIVO ----------
        function drawBackground() {
            // Fundo gradiente espacial
            const grad = ctx.createRadialGradient(400, 300, 100, 400, 300, 800);
            grad.addColorStop(0, '#0b1424');
            grad.addColorStop(0.5, '#050a14');
            grad.addColorStop(1, '#010101');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estrelinhas estáticas de fundo (efeito cintilante)
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            for (let i = 0; i < 100; i++) {
                // determinístico baseado em i para não mudar a cada frame
                const x = (i * 173) % canvas.width;
                const y = (i * 271) % canvas.height;
                const size = (Math.sin(i) * 1.5 + 2);
                const alpha = 0.3 + Math.sin(frameCounter * 0.02 + i) * 0.2;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        function drawStars() {
            for (let s of stars) {
                // Brilho cintilante
                const glow = 12 + Math.sin(s.twinkle) * 8;
                ctx.shadowColor = `hsl(${s.hue}, 100%, 75%)`;
                ctx.shadowBlur = glow;

                // Corpo da estrela (formato de estrela de 5 pontas ou círculo brilhante)
                // Vamos desenhar uma estrela de 5 pontas estilizada + círculo brilhante
                ctx.save();
                ctx.translate(s.x, s.y);
                // Desenha um círculo luminoso interno
                ctx.beginPath();
                ctx.arc(0, 0, s.radius * 0.9, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${s.hue}, 100%, 70%)`;
                ctx.fill();

                // Desenha contorno de estrela (5 pontas)
                ctx.shadowBlur = glow * 1.6;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
                    const outerX = Math.cos(angle) * s.radius * 1.5;
                    const outerY = Math.sin(angle) * s.radius * 1.5;
                    if (i === 0) ctx.moveTo(outerX, outerY);
                    else ctx.lineTo(outerX, outerY);

                    const innerAngle = angle + Math.PI / 5;
                    const innerX = Math.cos(innerAngle) * s.radius * 0.7;
                    const innerY = Math.sin(innerAngle) * s.radius * 0.7;
                    ctx.lineTo(innerX, innerY);
                }
                ctx.closePath();
                ctx.fillStyle = `hsl(${s.hue}, 100%, 82%)`;
                ctx.fill();
                ctx.restore();
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        function drawAsteroids() {
            for (let a of asteroids) {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rotation);

                // Sombra e brilho de asteróide
                ctx.shadowColor = '#4a3a2a';
                ctx.shadowBlur = 15;

                // Desenha o polígono irregular
                ctx.beginPath();
                const v = a.vertices;
                ctx.moveTo(v[0].x, v[0].y);
                for (let i = 1; i < v.length; i++) {
                    ctx.lineTo(v[i].x, v[i].y);
                }
                ctx.closePath();

                // Gradiente para dar volume
                const grad = ctx.createRadialGradient(-a.radius*0.3, -a.radius*0.3, a.radius*0.2, 0, 0, a.radius*1.2);
                grad.addColorStop(0, `hsl(${a.hue}, 40%, 45%)`);
                grad.addColorStop(0.7, `hsl(${a.hue}, 35%, 25%)`);
                grad.addColorStop(1, `hsl(${a.hue}, 30%, 12%)`);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = `hsl(${a.hue}, 30%, 18%)`;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Pequenas crateras (detalhe criativo)
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(-a.radius*0.25, -a.radius*0.2, a.radius*0.15, 0, 2*Math.PI);
                ctx.fillStyle = `hsl(${a.hue}, 30%, 10%)`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(a.radius*0.3, a.radius*0.15, a.radius*0.12, 0, 2*Math.PI);
                ctx.fillStyle = `hsl(${a.hue}, 25%, 8%)`;
                ctx.fill();

                ctx.restore();
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        }

        function drawShip() {
            // Rastro da nave (baseado no movimento)
            trail.push({x: shipX, y: shipY});
            if (trail.length > 10) trail.shift();

            // Desenha o rastro
            for (let i = 0; i < trail.length; i++) {
                const t = trail[i];
                const alpha = i / trail.length * 0.4;
                const size = SHIP_RADIUS * (i / trail.length) * 0.7;
                ctx.beginPath();
                ctx.arc(t.x, t.y, size, 0, 2*Math.PI);
                ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
                ctx.fill();
            }

            // Desenha a nave (estilo caça estelar)
            ctx.save();
            ctx.translate(shipX, shipY);
            // Inclinação baseada na direção do movimento? Podemos fazer a nave apontar para cima sempre
            // Corpo principal
            ctx.shadowColor = '#00aaff';
            ctx.shadowBlur = 25;

            // Asa esquerda
            ctx.beginPath();
            ctx.moveTo(-12, 8);
            ctx.lineTo(-24, 20);
            ctx.lineTo(-8, 18);
            ctx.closePath();
            ctx.fillStyle = '#aaccff';
            ctx.fill();
            ctx.shadowBlur = 15;

            // Asa direita
            ctx.beginPath();
            ctx.moveTo(12, 8);
            ctx.lineTo(24, 20);
            ctx.lineTo(8, 18);
            ctx.closePath();
            ctx.fillStyle = '#aaccff';
            ctx.fill();

            // Corpo da nave (forma de diamante)
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#3fa9f5';
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(12, 2);
            ctx.lineTo(0, 14);
            ctx.lineTo(-12, 2);
            ctx.closePath();
            const grad = ctx.createLinearGradient(-5, -10, 5, 10);
            grad.addColorStop(0, '#d0eaff');
            grad.addColorStop(0.6, '#8bb9fe');
            grad.addColorStop(1, '#4f7eb3');
            ctx.fillStyle = grad;
            ctx.fill();

            // Cabine (brilho)
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffffaa';
            ctx.beginPath();
            ctx.arc(0, -4, 5, 0, 2 * Math.PI);
            ctx.fillStyle = '#f0f9ff';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            // Efeito de "escudo" piscante quando game over
            if (!gameActive) {
                ctx.save();
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#ff3333';
                ctx.beginPath();
                ctx.arc(shipX, shipY, SHIP_RADIUS + 6, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ff5555';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawGameOver() {
            if (!gameActive) {
                ctx.save();
                ctx.font = 'bold 60px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff4444';
                ctx.fillStyle = '#ffffff';
                ctx.fillText('FIM DE JOGO', canvas.width/2, canvas.height/2 - 40);

                ctx.font = '32px "Segoe UI", sans-serif';
                ctx.shadowColor = '#00aaff';
                ctx.fillStyle = '#cceeff';
                ctx.fillText(`⭐ ${score}`, canvas.width/2, canvas.height/2 + 50);
                ctx.restore();
            }
        }

        // ---------- LOOP PRINCIPAL ----------
        function gameLoop() {
            if (gameActive) {
                lerpShip();
                spawnObjects();
                updateObjects();
            }

            // Desenho (sempre)
            drawBackground();
            drawStars();
            drawAsteroids();
            drawShip();
            drawGameOver();

            // Contador de frames (mesmo se game over, mas não spawna)
            if (gameActive) {
                frameCounter++;
            } else {
                // Pequena animação no game over (piscar o texto)
                frameCounter++;
            }

            requestAnimationFrame(gameLoop);
        }

        // ---------- INICIALIZAÇÃO ----------
        function init() {
            resetGame();
            // Garantir que o mouse comece no centro
            mouseX = canvas.width / 2;
            mouseY = canvas.height / 2;
            shipX = mouseX;
            shipY = mouseY;
            gameLoop();
        }

        // Botão de reiniciar
        document.getElementById('restartBtn').addEventListener('click', () => {
            resetGame();
            // Reposiciona a nave para o centro
            mouseX = canvas.width / 2;
            mouseY = canvas.height / 2;
            shipX = mouseX;
            shipY = mouseY;
        });

        // Inicia o jogo
        init();
    })();
</script>
</body>
</html>
